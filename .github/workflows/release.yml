name: release

# Builds, signs, notarizes and staples the .app, then publishes the DMG as a GitHub Release.
# The GitHub Release is the only place a build is published: the site reads the GitHub API
# (docs/SITE.md). docs/RELEASE.md is the human procedure; this file is the machine one.
#
# One job, on macos-15. There is no OS matrix and no cross-platform build: the product is a
# macOS menu-bar app signed and notarized by Apple tooling, none of which exists elsewhere.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEVELOPER_ID_P12          base64 of your "Developer ID Application" cert exported as .p12
#                             export from Keychain Access, then: base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_P12_PASSWORD the password you set when exporting that .p12
#   KEYCHAIN_PASSWORD         any random string; scopes the temporary CI keychain
#   AC_API_KEY_ID             App Store Connect API key id        (e.g. ABCD1234EF)
#   AC_API_ISSUER_ID          App Store Connect issuer id         (a UUID)
#   AC_API_KEY_P8             contents of the AuthKey_XXXX.p8 file, verbatim
#   ANTHROPIC_API_KEY         writes the release notes; without it they are the commit list
#
# The API-key route is preferred over an app-specific password: it is scoped, revocable,
# and does not carry your Apple ID.
#
# This workflow never renders a brand asset. packages/assets is local-only (docs/WEB.md): the
# icon, the OG image and the hero video are committed files that `make bundle` and the site
# consume as they are.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize and staple (needs the Apple secrets)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    # `secrets` cannot be referenced from a step-level `if:`, so presence is hoisted here.
    # A fork, or this repo before the secrets exist, skips those steps instead of failing red.
    env:
      HAS_SIGNING_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_API_KEY_P8 != '' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are the commits since the previous tag, so the whole history is needed.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run test` names the packages one by one; `bun test packages` would walk the whole
      # directory and pick up packages/assets, which is local-only (docs/WEB.md), is not a
      # workspace, and whose Remotion dependencies this job never installs.
      - name: Unit tests
        run: bun run test

      # Fail in ten seconds rather than after a twenty-minute notarization.
      - name: Resolve the release version
        if: env.IS_TAG == 'true'
        run: bun run packages/build/version-check.ts --tag "$GITHUB_REF"

      - name: Assemble the unsigned bundle
        run: make bundle

      # The tag says one version; this proves the binary says the same one.
      - name: Check the bundle advertises the tagged version
        if: env.IS_TAG == 'true'
        run: bun run packages/build/version-check.ts --tag "$GITHUB_REF" --app dist/LocalhostAliases.app

      # Signing needs the certificate in a keychain. A dedicated, ephemeral keychain keeps it
      # out of the runner's default one and is discarded with the VM.
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that can never be answered in CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign
        if: env.HAS_SIGNING_CERT == 'true'
        run: make sign

      - name: Notarize and staple
        if: env.HAS_NOTARY_KEY == 'true' && inputs.notarize != false
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY"
          export NOTARY_ARGS="--key $KEY --key-id $AC_API_KEY_ID --issuer $AC_API_ISSUER_ID"
          make notarize
          rm -f "$KEY"

      - name: Build DMG
        run: make dmg

      - name: Verify the artifact the way a user's Mac will
        run: |
          set -euo pipefail
          APP="dist/LocalhostAliases.app"
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "::warning::codesign verify failed (expected for unsigned builds)"
          spctl -a -vvv -t install "$APP" || echo "::warning::Gatekeeper rejected (expected until notarized)"
          xcrun stapler validate "$APP" || echo "::warning::no stapled ticket (expected until notarized)"

      # One checksum, computed by the shell, published in both places a user can see it: the
      # release body and the .dmg.sha256 sidecar attached to the same release.
      - name: Checksum the DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -n1)"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          SIZE="$(stat -f%z "$DMG")"
          # shasum -c reads this format directly, so a user can verify with one command.
          (cd dist && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          {
            echo "path=$DMG"
            echo "filename=$(basename "$DMG")"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "$SHA  $(basename "$DMG")  ($SIZE bytes)"

      # The notes a human reads. An annotated tag's message wins outright: a person wrote it
      # for this release, and re-writing it would both overwrite them and bill the API.
      - name: Take the release notes from the annotated tag, if it has a message
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="$GITHUB_REF_NAME"
          # `git tag -l --format` happily returns the tagged *commit's* message for a lightweight
          # tag, which is not release notes, so ask what kind of object the tag actually is.
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP/,$d' > dist/RELEASE_NOTES.md
          fi
          # An empty file is the same as no file to release-notes.ts; keep the tree tidy.
          [ -s dist/RELEASE_NOTES.md ] || rm -f dist/RELEASE_NOTES.md

      # Usually there is nothing left for this job to write: .githooks/pre-push asked the local
      # `claude` for the notes before the tag was pushed and committed the answer, so the model
      # has already been paid for once, on a laptop, with no API key involved. This ranks below
      # an annotated tag's message (a human beats a model) and above generating anything here.
      - name: Use the release notes the pre-push hook committed, if there are any
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMITTED="release-notes/$GITHUB_REF_NAME.md"
          if [ -s dist/RELEASE_NOTES.md ]; then
            echo "release notes: the annotated tag's message wins; $COMMITTED not consulted"
          elif [ -s "$COMMITTED" ]; then
            cp "$COMMITTED" dist/RELEASE_NOTES.md
            echo "release notes: using committed $COMMITTED"
          else
            echo "release notes: no committed notes for $GITHUB_REF_NAME; this job will write them"
          fi

      # Generated notes cost money. A re-run of the same tag restores them instead of paying
      # again; the cache is saved at the end of the job when the key was not already present.
      - name: Restore previously generated release notes
        if: env.IS_TAG == 'true'
        uses: actions/cache@v4
        with:
          path: dist/RELEASE_NOTES.md
          key: release-notes-${{ github.ref_name }}

      # `secrets` cannot be read from a step-level `if:`, hence HAS_ANTHROPIC_KEY on the job.
      # Without the secret this step is skipped, not failed — a fork still cuts a release, with
      # the grouped commit list as its notes.
      - name: Write the release notes with Claude
        id: notes
        if: env.IS_TAG == 'true' && env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bun run packages/build/release-notes.ts \
            --tag "$GITHUB_REF" \
            --generate \
            --notes dist/RELEASE_NOTES.md

      # Never calls the API, always writes dist/RELEASE_BODY.md. The notes go on top; the
      # version, date, sha256, size, download URL and compare link are computed by the script
      # from this build, so nothing a commit message said can change them.
      - name: Compose the release body
        if: env.IS_TAG == 'true'
        run: |
          bun run packages/build/release-notes.ts \
            --tag "$GITHUB_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --notes dist/RELEASE_NOTES.md \
            --out dist/RELEASE_BODY.md \
            --filename "${{ steps.dmg.outputs.filename }}" \
            --sha256 "${{ steps.dmg.outputs.sha256 }}" \
            --size "${{ steps.dmg.outputs.size }}"
          cat dist/RELEASE_BODY.md

      - name: Say what was published
        if: always() && env.IS_TAG == 'true'
        run: |
          {
            echo "### ${{ github.ref_name }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| sha256 | \`${{ steps.dmg.outputs.sha256 }}\` |"
            echo "| size | ${{ steps.dmg.outputs.size }} bytes |"
            echo "| signed | ${{ env.HAS_SIGNING_CERT }} |"
            echo "| notarized | ${{ env.HAS_NOTARY_KEY }} |"
            echo "| notes | ${{ steps.notes.outputs.source == 'model' && 'written by claude-opus-5' || 'the grouped commit list' }} |"
            echo "| release | ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalhostAliases-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/RELEASE_NOTES.md
            dist/RELEASE_BODY.md
          if-no-files-found: error

      # The release is the product: the site resolves the latest version, the notes and the DMG
      # from the GitHub API (docs/SITE.md), so this step is what makes a build exist.
      - name: Attach the DMG to the release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          fail_on_unmatched_files: true
