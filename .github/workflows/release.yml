name: release

# Builds, signs, notarizes and staples the .app, then publishes a DMG to Vercel Blob and to a
# GitHub Release. docs/RELEASE.md is the human procedure; this file is the machine one.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEVELOPER_ID_P12          base64 of your "Developer ID Application" cert exported as .p12
#                             export from Keychain Access, then: base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_P12_PASSWORD the password you set when exporting that .p12
#   KEYCHAIN_PASSWORD         any random string; scopes the temporary CI keychain
#   AC_API_KEY_ID             App Store Connect API key id        (e.g. ABCD1234EF)
#   AC_API_ISSUER_ID          App Store Connect issuer id         (a UUID)
#   AC_API_KEY_P8             contents of the AuthKey_XXXX.p8 file, verbatim
#   BLOB_READ_WRITE_TOKEN     Vercel Blob read-write token; without it the upload is skipped
#
# The API-key route is preferred over an app-specific password: it is scoped, revocable,
# and does not carry your Apple ID.
#
# This workflow never renders a brand asset. packages/assets is local-only (docs/WEB.md): the
# icon, the OG image and the hero video are committed files that `make bundle` and the site
# consume as they are.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize and staple (needs the Apple secrets)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    # `secrets` cannot be referenced from a step-level `if:`, so presence is hoisted here.
    # A fork, or this repo before the secrets exist, skips those steps instead of failing red.
    env:
      HAS_SIGNING_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_API_KEY_P8 != '' }}
      HAS_BLOB_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are the commits since the previous tag, so the whole history is needed.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test packages

      # Fail in ten seconds rather than after a twenty-minute notarization.
      - name: Resolve the release version
        if: env.IS_TAG == 'true'
        run: bun run packages/build/version-check.ts --tag "$GITHUB_REF"

      - name: Assemble the unsigned bundle
        run: make bundle

      # The tag says one version; this proves the binary says the same one.
      - name: Check the bundle advertises the tagged version
        if: env.IS_TAG == 'true'
        run: bun run packages/build/version-check.ts --tag "$GITHUB_REF" --app dist/LocalhostAliases.app

      # Signing needs the certificate in a keychain. A dedicated, ephemeral keychain keeps it
      # out of the runner's default one and is discarded with the VM.
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that can never be answered in CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign
        if: env.HAS_SIGNING_CERT == 'true'
        run: make sign

      - name: Notarize and staple
        if: env.HAS_NOTARY_KEY == 'true' && inputs.notarize != false
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY"
          export NOTARY_ARGS="--key $KEY --key-id $AC_API_KEY_ID --issuer $AC_API_ISSUER_ID"
          make notarize
          rm -f "$KEY"

      - name: Build DMG
        run: make dmg

      - name: Verify the artifact the way a user's Mac will
        run: |
          set -euo pipefail
          APP="dist/LocalhostAliases.app"
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "::warning::codesign verify failed (expected for unsigned builds)"
          spctl -a -vvv -t install "$APP" || echo "::warning::Gatekeeper rejected (expected until notarized)"
          xcrun stapler validate "$APP" || echo "::warning::no stapled ticket (expected until notarized)"

      # One checksum, computed by the shell, published everywhere: the release body, the .sha256
      # sidecar and the manifest. publish.ts recomputes it in Bun and refuses to disagree.
      - name: Checksum the DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -n1)"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          SIZE="$(stat -f%z "$DMG")"
          # shasum -c reads this format directly, so a user can verify with one command.
          (cd dist && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          {
            echo "path=$DMG"
            echo "filename=$(basename "$DMG")"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "$SHA  $(basename "$DMG")  ($SIZE bytes)"

      - name: Compose the release notes
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          NOTES=dist/RELEASE_NOTES.md
          # An annotated tag is where a human writes the notes. `git tag -l --format` would happily
          # return the tagged *commit's* message for a lightweight tag, which is not release notes,
          # so ask what kind of object the tag actually is first.
          : > "$NOTES"
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP/,$d' > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              echo "### Changes since $PREV" > "$NOTES"
              echo >> "$NOTES"
              git log --no-merges --pretty=format:'- %s' "$PREV..$TAG" >> "$NOTES"
              echo >> "$NOTES"
            else
              echo "First published release." > "$NOTES"
            fi
          fi

          # The GitHub release body is the notes plus what a careful user needs to trust the file.
          # The manifest keeps the notes alone — the site renders its own verification section.
          {
            cat "$NOTES"
            echo
            echo "---"
            echo
            echo '```'
            echo "sha256  ${{ steps.dmg.outputs.sha256 }}"
            echo "size    ${{ steps.dmg.outputs.size }} bytes"
            echo '```'
            echo
            echo "Verify the download before opening it:"
            echo
            echo '```sh'
            echo "shasum -a 256 ${{ steps.dmg.outputs.filename }}"
            echo "spctl -a -vvv -t install /Volumes/Localhost\\ Aliases/LocalhostAliases.app"
            echo "xcrun stapler validate /Volumes/Localhost\\ Aliases/LocalhostAliases.app"
            echo '```'
          } > dist/RELEASE_BODY.md
          cat dist/RELEASE_BODY.md

      # Skipped, not failed, when the token is absent — a fork can build a DMG without one.
      - name: Publish to Vercel Blob
        id: publish
        if: env.IS_TAG == 'true' && env.HAS_BLOB_TOKEN == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          bun run packages/build/publish.ts \
            --tag "$GITHUB_REF" \
            --dmg "${{ steps.dmg.outputs.path }}" \
            --app dist/LocalhostAliases.app \
            --notes-file dist/RELEASE_NOTES.md \
            --expect-sha256 "${{ steps.dmg.outputs.sha256 }}" \
            --out dist/latest.json

      - name: Say what was published
        if: always() && env.IS_TAG == 'true'
        run: |
          {
            echo "### ${{ github.ref_name }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| sha256 | \`${{ steps.dmg.outputs.sha256 }}\` |"
            echo "| size | ${{ steps.dmg.outputs.size }} bytes |"
            echo "| signed | ${{ env.HAS_SIGNING_CERT }} |"
            echo "| notarized | ${{ env.HAS_NOTARY_KEY }} |"
            echo "| blob | ${{ steps.publish.outputs.dmg_url || 'skipped — BLOB_READ_WRITE_TOKEN is not set' }} |"
            echo "| manifest | ${{ steps.publish.outputs.manifest_url || 'not updated' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalhostAliases-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      # The durable mirror. Blob can be re-provisioned; a GitHub Release outlives it.
      - name: Attach the DMG to the release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          fail_on_unmatched_files: true
